name: Fuzz

on:
  schedule:
    # Weekly, Monday 03:00 UTC
    - cron: "0 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fuzz:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        target:
          - FuzzRoutineStateTransitions
          - FuzzLifecyclePublicAPI
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.24.x"
          cache: true

      - name: Fuzz ${{ matrix.target }}
        run: go test -run "^$" -fuzz "^${{ matrix.target }}$" -fuzztime=60s .
